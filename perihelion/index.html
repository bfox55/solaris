<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perihelion — a living model of the Solar System</title>
<meta name="description" content="A real-time, Keplerian simulation of the Solar System inside the Milky Way, built with three.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #eef1f7;
    --ink-2: #aab2c5;
    --ink-3: #6f7890;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --glass: rgba(13, 16, 24, 0.58);
    --glass-hi: rgba(255, 255, 255, 0.06);
    --accent: #ffb65c;
    --accent-ink: #1a1206;
    --radius: 18px;
    --radius-sm: 10px;
    --gap: 16px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- world labels ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; padding: 5px 8px 5px 0;
    pointer-events: auto; font-size: 10.5px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase;
    color: rgba(238, 241, 247, 0.72); white-space: nowrap; will-change: transform; transition: color 0.2s, opacity 0.25s;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); }
  .label i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--c, #fff); flex: none;
    box-shadow: 0 0 8px color-mix(in srgb, var(--c, #fff) 55%, transparent); transition: transform 0.2s var(--ease); }
  .label.no-ring i { visibility: hidden; }
  .label:hover { color: #fff; }
  .label:hover i { transform: scale(1.35); }
  .label.active { color: var(--accent); }
  .label.minor { font-size: 9.5px; color: rgba(238, 241, 247, 0.55); }
  .label.minor i { width: 7px; height: 7px; border-width: 1px; }
  .label.hidden { opacity: 0; pointer-events: none; }

  /* ---------- HUD shell ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right))
      max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
    display: grid; grid-template-columns: 208px 1fr 300px; grid-template-rows: auto 1fr auto; gap: var(--gap);
    grid-template-areas: "brand . tools" "rail . card" "dock dock dock"; transition: opacity 0.35s; }
  body.clean #hud, body.clean #labels { opacity: 0; pointer-events: none; }
  body.clean #hud * { pointer-events: none !important; }
  .panel { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
    box-shadow: 0 1px 0 var(--glass-hi) inset, 0 18px 48px rgba(0, 0, 0, 0.45); }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }

  /* brand */
  .brand { grid-area: brand; align-self: start; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
  .brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

  /* view toggles */
  .tools { grid-area: tools; justify-self: end; align-self: start; display: flex; align-items: center; gap: 2px; padding: 5px; }
  .chip { height: 32px; padding: 0 12px; white-space: nowrap; border-radius: 12px; font-size: 12.5px; font-weight: 500; color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s, color 0.2s; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.45; transition: 0.2s; }
  .chip:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
  .chip[aria-pressed="true"] { color: var(--ink); }
  .chip[aria-pressed="true"]::before { background: var(--accent); opacity: 1; box-shadow: 0 0 8px var(--accent); }
  .icon-btn { width: 32px; height: 32px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); transition: 0.2s; }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.07); color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }

  /* rail */
  .rail { grid-area: rail; align-self: start; padding: 10px 8px; max-height: 100%; overflow: auto; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail .eyebrow { display: block; padding: 4px 10px 8px; }
  .rail button { width: 100%; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; color: var(--ink-2); text-align: left; transition: background 0.18s, color 0.18s; }
  .rail button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); flex: none; }
  .rail button kbd { margin-left: auto; font: inherit; font-size: 10.5px; color: var(--ink-3); opacity: 0; transition: opacity 0.18s; }
  .rail button:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
  .rail button:hover kbd { opacity: 1; }
  .rail button[aria-current="true"] { background: rgba(255, 255, 255, 0.09); color: #fff; }
  .rail .rule { height: 1px; background: var(--line); margin: 6px 10px; }

  /* info card */
  .card { grid-area: card; align-self: start; padding: 18px 18px 16px; max-height: 100%; overflow: auto; scrollbar-width: none; }
  .card::-webkit-scrollbar { display: none; }
  .card-head { display: flex; justify-content: space-between; align-items: center; }
  .card h2 { margin: 8px 0 0; font-size: 27px; font-weight: 650; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .card h2 i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .card .blurb { margin: 10px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .card .body { overflow: hidden; }
  .card.collapsed .body { display: none; }
  .card.collapsed .collapse svg { transform: rotate(180deg); }
  .collapse svg { transition: transform 0.25s var(--ease); }
  .live { margin: 16px 0 0; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.045); border: 1px solid var(--line);
    display: grid; gap: 10px; }
  .live div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .live dt { font-size: 12px; color: var(--ink-3); }
  .live dd { margin: 0; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .live dd small { font-weight: 500; color: var(--ink-3); font-size: 11.5px; margin-left: 3px; }
  .facts { margin: 16px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .facts dt { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .facts dd { margin: 3px 0 0; font-size: 13.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .moons { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .moons div { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12px; font-weight: 500; color: var(--ink-2); transition: 0.18s; }
  .pill:hover { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: rgba(255, 255, 255, 0.3); }

  /* time dock */
  .dock { grid-area: dock; justify-self: center; width: min(100%, 1020px); padding: 14px 20px; display: grid;
    grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; }
  .clock { min-width: 148px; }
  .date { margin-top: 4px; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
  .time { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 1px; min-height: 16px; }
  .transport { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .buttons { display: flex; align-items: center; gap: 6px; flex: none; }
  .tbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); border: 1px solid var(--line);
    transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.18s var(--ease); }
  .tbtn svg { width: 16px; height: 16px; }
  .tbtn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: var(--line-strong); }
  .tbtn:active { transform: scale(0.94); }
  .tbtn[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .tbtn.primary { width: 46px; height: 46px; background: var(--ink); color: #0b0d13; border-color: transparent; }
  .tbtn.primary:hover { background: #fff; color: #000; }
  .tbtn.primary svg { width: 18px; height: 18px; }
  .tbtn.text { width: auto; padding: 0 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  #dateInput { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; color-scheme: dark; }
  .scrub { flex: 1; min-width: 0; padding-top: 6px; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; --fill: 50%; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent) var(--fill), rgba(255, 255, 255, 0.14) var(--fill)); }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); }
  input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 182, 92, 0.22), 0 2px 8px rgba(0, 0, 0, 0.5); transition: box-shadow 0.18s; }
  input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255, 182, 92, 0.22); }
  input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 7px rgba(255, 182, 92, 0.25), 0 2px 8px rgba(0, 0, 0, 0.5); }
  .ticks { position: relative; height: 20px; margin: 2px 8px 0; }
  .ticks button { position: absolute; top: 0; transform: translateX(-50%); padding: 3px 5px; border-radius: 6px; font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.04em; color: var(--ink-3); white-space: nowrap; transition: color 0.18s; }
  .ticks button:hover, .ticks button.on { color: var(--ink); }
  .rate { text-align: right; min-width: 112px; }
  .rate-val { margin-top: 4px; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
  .rate-val.rev { color: var(--accent); }
  .rate-unit { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }

  .hint { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); font-size: 12px; color: var(--ink-3); letter-spacing: 0.02em;
    pointer-events: none; transition: opacity 1s; white-space: nowrap; text-shadow: 0 1px 8px #000; }
  .hint.gone { opacity: 0; }
  .hint b { color: var(--ink-2); font-weight: 600; }

  /* loader */
  #loader { position: fixed; inset: 0; background: #020308; display: grid; place-items: center; z-index: 10; transition: opacity 0.9s var(--ease), visibility 0.9s; }
  #loader.done { opacity: 0; visibility: hidden; }
  #loader .box { text-align: center; width: 220px; }
  #loader .orb { width: 54px; height: 54px; margin: 0 auto 22px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.14); position: relative; animation: spin 2.4s linear infinite; }
  #loader .orb::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); top: -4px; left: 50%; margin-left: -3.5px; box-shadow: 0 0 12px var(--accent); }
  #loader .orb::before { content: ""; position: absolute; inset: 19px; border-radius: 50%; background: radial-gradient(#fff3d6, #ffb65c 60%, #ff8a2a); box-shadow: 0 0 22px #ff9a3c; }
  #loader p { margin: 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  #loader .bar { margin-top: 14px; height: 2px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; }
  #loader .bar b { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }
  #loader .err { color: #ff8f7a; text-transform: none; letter-spacing: 0; line-height: 1.5; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- responsive ---------- */
  @media (max-width: 1080px) {
    #hud { grid-template-columns: 180px 1fr 264px; }
    .chip { padding: 0 9px; }
  }
  @media (max-width: 820px) {
    :root { --gap: 10px; }
    #hud { grid-template-columns: 1fr auto; grid-template-rows: auto auto 1fr auto auto;
      grid-template-areas: "brand tools" "card card" ". ." "rail rail" "dock dock"; }
    .brand p { display: none; }
    .brand { padding: 8px 12px 8px 8px; }
    .brand svg { width: 28px; height: 28px; }
    .chip { font-size: 0; padding: 0 10px; gap: 0; }
    .chip::after { content: attr(data-short); font-size: 12px; margin-left: 6px; }
    .rail { display: flex; gap: 2px; padding: 5px; overflow-x: auto; max-width: 100%; }
    .rail .eyebrow, .rail .rule, .rail kbd { display: none; }
    .rail button { width: auto; flex: none; height: 32px; }
    .card { padding: 12px 14px; max-height: 46vh; }
    .card h2 { font-size: 20px; margin-top: 4px; }
    .dock { grid-template-columns: 1fr auto; gap: 10px 14px; padding: 12px 14px; }
    .transport { grid-column: 1 / -1; grid-row: 2; gap: 12px; }
    .date, .rate-val { font-size: 18px; }
    .tbtn.text { display: none; }
    .ticks button:nth-child(even) { display: none; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>

<body>
<canvas id="scene" aria-label="3D view of the Solar System"></canvas>
<div id="labels"></div>

<div id="hud">
  <div class="brand panel">
    <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <ellipse cx="17" cy="17" rx="15" ry="8.5" stroke="rgba(255,255,255,.28)" transform="rotate(-24 17 17)"/>
      <circle cx="13.5" cy="17.5" r="4.6" fill="#ffb65c"/>
      <circle cx="29.2" cy="9.6" r="1.9" fill="#eef1f7"/>
    </svg>
    <div><h1>Perihelion</h1><p>Live Keplerian ephemeris</p></div>
  </div>

  <div class="tools panel" role="toolbar" aria-label="View options">
    <button class="chip" id="tOrbits" data-short="O" aria-pressed="true" title="Orbit paths (O)">Orbits</button>
    <button class="chip" id="tLabels" data-short="L" aria-pressed="true" title="Labels (L)">Labels</button>
    <button class="chip" id="tBelts" data-short="B" aria-pressed="true" title="Asteroid &amp; Kuiper belts (B)">Belts</button>
    <button class="chip" id="tScale" data-short="T" aria-pressed="false" title="Show bodies at their true size (T)">True scale</button>
    <span class="sep"></span>
    <button class="icon-btn" id="tFull" title="Fullscreen (F)" aria-label="Toggle fullscreen">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
    </button>
  </div>

  <nav class="rail panel" id="rail" aria-label="Worlds"><span class="eyebrow">Worlds</span></nav>

  <aside class="card panel" id="card" aria-live="polite">
    <div class="card-head">
      <span class="eyebrow" id="cKind"></span>
      <button class="icon-btn collapse" id="cCollapse" aria-label="Collapse details" aria-expanded="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>
      </button>
    </div>
    <h2><i id="cDot"></i><span id="cName"></span></h2>
    <div class="body">
      <p class="blurb" id="cBlurb"></p>
      <dl class="live" id="cLive"></dl>
      <dl class="facts" id="cFacts"></dl>
      <div class="moons" id="cMoons"></div>
    </div>
  </aside>

  <footer class="dock panel">
    <div class="clock">
      <span class="eyebrow">Simulated date · UTC</span>
      <div class="date" id="date">—</div>
      <div class="time" id="time"></div>
    </div>
    <div class="transport">
      <div class="buttons">
        <button class="tbtn" id="rev" aria-pressed="false" title="Run time backwards (R)" aria-label="Reverse time">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M7.5 3.2v9.6L1 8zM15 3.2v9.6L8.5 8z"/></svg>
        </button>
        <button class="tbtn primary" id="play" title="Play / pause (Space)" aria-label="Pause">
          <svg viewBox="0 0 16 16" fill="currentColor" id="playIcon"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
        </button>
        <button class="tbtn" id="pick" title="Jump to a date" aria-label="Jump to a date">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="12" height="11" rx="2.5"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/></svg>
        </button>
        <input type="date" id="dateInput" min="1000-01-01" max="2999-12-31" tabindex="-1" aria-hidden="true">
        <button class="tbtn text" id="now" title="Return to the present (N)">Now</button>
      </div>
      <div class="scrub">
        <input type="range" id="speed" min="0" max="1000" step="1" aria-label="Time rate">
        <div class="ticks" id="ticks"></div>
      </div>
    </div>
    <div class="rate">
      <span class="eyebrow">Time rate</span>
      <div class="rate-val" id="rateVal">—</div>
      <div class="rate-unit" id="rateUnit">per second</div>
    </div>
  </footer>
</div>

<div class="hint" id="hint"><b>Drag</b> to orbit · <b>Scroll</b> to zoom from a moon out to the galaxy · <b>Space</b> pauses · <b>H</b> hides the HUD</div>

<div id="loader"><div class="box"><div class="orb"></div><p id="loadText">Assembling worlds</p><div class="bar"><b id="loadBar"></b></div></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ====================================================================== *
 *  Constants
 * ====================================================================== */
const AU = 100;                      // scene units per astronomical unit
const AU_KM = 149597870.7;
const DAY_MS = 86400000;
const J2000 = 2451545.0;             // Julian date of the J2000 epoch
const DEG = Math.PI / 180;
const TAU = Math.PI * 2;
const OBLIQUITY = 23.43928 * DEG;    // Earth's axial tilt: equatorial -> ecliptic
const MAX_RATE = 10 * 365.25 * 86400; // fastest time rate: 10 years per second
const LOG_MAX = Math.log10(MAX_RATE);
const MIN_MS = Date.UTC(1000, 0, 1), MAX_MS = Date.UTC(3000, 0, 1);
const GALAXY_R = 5e5;                // radius of the Milky Way model, scene units
const ORBIT_SEGMENTS = 1024;
const $ = (id) => document.getElementById(id);

/* ====================================================================== *
 *  Small maths helpers
 * ====================================================================== */
const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const sstep = (a, b, x) => { x = sat((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const frac = (x) => x - Math.floor(x);

/** Deterministic PRNG so every load builds the same sky. */

    if (galaxyFade > 0.5 && b.id !== 'sun') visible = false;
    if (apparent > 64) visible = false;
    const x = (tmpV.x * 0.5 + 0.5) * W, y = (-tmpV.y * 0.5 + 0.5) * H, off = apparent > 5 ? apparent + 6 : -5.5;
    if (visible) { const w = 30 + b.name.length * 7.5; if (placed.some((p) => Math.abs(p[0] - x) < (p[2] + w) / 2 + 10 && Math.abs(p[1] - y) < 15)) visible = false; else placed.push([x, y, w]); }
    l.classList.toggle('hidden', !visible);
    if (visible) { l.classList.toggle('no-ring', apparent > 5); l.style.transform = `translate(${x + off}px, ${y}px) translateY(-50%)`; }
  }
  const sunLabel = byId.sun.label.lastChild, name = galaxyFade > 0.5 ? 'Solar System' : 'Sun';
  if (sunLabel.textContent !== name) sunLabel.textContent = name;
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  shared.uTime.value = now / 1000;

  // --- time ---
  if (state.playing) {
    state.simMs += dt * state.rate * state.dir * 1000;
    if (state.simMs <= MIN_MS || state.simMs >= MAX_MS) { state.simMs = Math.min(MAX_MS, Math.max(MIN_MS, state.simMs)); setPlaying(false); }
  }
  const jd = state.simMs / DAY_MS + 2440587.5;

  // --- scale mode ---
  const prevR = state.focus.R;
  if (state.scaleK !== state.scaleTarget) { const s = Math.sign(state.scaleTarget - state.scaleK); state.scaleK = sat(state.scaleK + s * dt / 1.6); }
  updateBodies(jd);
  if (prevR && state.focus.R !== prevR && !state.wide && !state.zoom && state.focus.id !== 'halley') camera.position.multiplyScalar(state.focus.R / prevR);

  // --- floating origin: the focused body sits at (0,0,0) so close-ups never lose float precision ---
  if (state.focusK < 1) state.focusK = Math.min(1, state.focusK + dt / 1.8);
  const fk = easeInOut(state.focusK), f = state.focus.p, pf = (state.prevFocus || state.focus).p;
  for (let i = 0; i < 3; i++) origin[i] = lerp(pf[i], f[i], fk);
  for (const b of BODIES) {
    b.group.position.set(b.p[0] - origin[0], b.p[1] - origin[1], b.p[2] - origin[2]); b.group.scale.setScalar(b.R);
    if (b.ring) { b.ring.material.uniforms.uCenter.value.copy(b.group.position); b.ring.material.uniforms.uRad.value = b.R; }
  }
  const sunPos = byId.sun.group.position;
  shared.uSun.value.copy(sunPos); sunLight.position.copy(sunPos);

  // --- camera ---
  if (state.zoom) {
    const z = state.zoom; z.k = Math.min(1, z.k + dt / z.dur);
    camera.position.setLength(Math.exp(lerp(Math.log(z.d0), Math.log(z.d1), easeInOut(z.k))));
    if (z.k >= 1) state.zoom = null;
  }
  controls.minDistance = state.focus.comet ? 2 : state.focus.R * 1.25;
  controls.update();
  const camDist = camera.position.length();
  camera.near = Math.max(1e-6, camDist * 0.01); camera.far = Math.max(camDist * 2e4, 2e5); camera.updateProjectionMatrix();

  // --- sky and galaxy ---
  const dSun = camera.position.distanceTo(sunPos), gf = sstep(3.9, 4.9, Math.log10(Math.max(1, dSun)));
  state.galaxyFade = gf;
  sky.position.copy(camera.position); sky.scale.setScalar(camera.near * 100);
  skyUniforms.uFade.value = 1 - gf;
  galaxy.visible = gf > 0.001; galaxy.position.copy(sunPos).addScaledVector(GAL_CENTER, GALAXY_R * 0.52);
  galaxyUniforms.uFade.value = gf; galaxy.userData.core.material.opacity = gf * 0.16;

  // --- orbits, belts, glints ---
  const orbitTarget = state.show.orbits ? 1 - gf : 0; state.orbitFade += (orbitTarget - state.orbitFade) * Math.min(1, dt * 6);
  for (const b of BODIES) {
    if (b.orbit) {
      let op = state.orbitFade;
      if (b.moon) { b.orbit.position.copy(b.parent.group.position); b.orbit.scale.setScalar(b.dist);
        op *= sstep(18, 60, (b.dist / b.parent.group.position.distanceTo(camera.position)) * pxPerRad) * 0.8; }
      else b.orbit.position.copy(sunPos);
      b.orbit.material.uniforms.uGap.value = (b.R * 1.12) / (TAU * (b.moon ? b.dist : b.aAU * AU));
      b.orbit.material.uniforms.uOpacity.value = op; b.orbit.visible = op > 0.003;
    }
    if (b.glint) {
      const dist = b.group.position.distanceTo(camera.position), apparent = (b.R / dist) * pxPerRad;
      b.glint.position.copy(b.group.position); b.glint.scale.setScalar(dist * (b.moon ? 0.008 : 0.013));
      let op = sat(1.6 - apparent / 2.2) * (1 - gf) * (b.moon ? 0.7 : 1);
      if (b.moon) op *= sstep(8, 30, (b.dist / b.parent.group.position.distanceTo(camera.position)) * pxPerRad);
      if (b.comet) op = (1 - gf) * sat(0.35 + 2 / b.rAU);
      b.glint.material.opacity = op; b.glint.visible = op > 0.003;
    }
    if (b.tail) {   // camera-facing ribbon pointing directly away from the Sun
      const p = b.group.position, away = tmpV.copy(p).sub(sunPos).normalize();
      const side = tmpV2.copy(camera.position).sub(p).cross(away).normalize();
      const len = Math.min(170, 70 / Math.pow(Math.max(b.rAU, 0.4), 1.4)), w = len * 0.11, arr = b.tail.geometry.attributes.position.array;
      const set = (i, a, s) => { arr[i * 3] = p.x + away.x * a + side.x * s; arr[i * 3 + 1] = p.y + away.y * a + side.y * s; arr[i * 3 + 2] = p.z + away.z * a + side.z * s; };
      set(0, -len * 0.01, -w * 0.12); set(1, -len * 0.01, w * 0.12); set(2, len, -w); set(3, len, w);
      b.tail.geometry.attributes.position.needsUpdate = true;
      b.tail.material.uniforms.uOpacity.value = sat(4 / (b.rAU * b.rAU)) * (1 - gf);
    }
  }
  const sun = byId.sun;
  sun.glow.position.copy(sunPos); sun.glow.scale.setScalar(Math.max(sun.R * 9, dSun * lerp(0.055, 0.03, gf)));
  updateBelts(jd - J2000);
  for (const b of belts) { b.pts.position.copy(sunPos); b.pts.material.opacity = 0.55 * (1 - gf) * sstep(2.5e4, 2500, dSun); b.pts.visible = state.show.belts && b.pts.material.opacity > 0.01; }

  for (const b of BODIES) if (b.poleQ && b.mesh && b.moon) b.tilt.quaternion.copy(b.poleQ);
  updateLabels(gf); updateClock(); updateLive(now);
  composer.render();
}

/* ====================================================================== *
 *  Boot
 * ====================================================================== */
(async function boot() {
  try {
    resize(); setRate(state.rate);
    await buildWorlds((p) => { $('loadBar').style.width = p * 100 + '%'; });
    state.focus = byId.sun; renderCard(byId.sun); syncRail();
    updateBodies(state.simMs / DAY_MS + 2440587.5);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    camera.position.set(0.32, 0.46, 1).normalize().multiplyScalar(reduced ? OVERVIEW : 42000);
    if (!reduced) state.zoom = { d0: 42000, d1: OVERVIEW, k: 0, dur: 6.5 };   // fall in from interstellar space
    requestAnimationFrame((t) => { last = t; frame(t); });
    $('loader').classList.add('done');
    setTimeout(() => $('hint').classList.add('gone'), 14000);
    window.__perihelion = { state, BODIES, byId, focusOn, camera };
  } catch (err) {
    console.error(err);
    $('loadText').className = 'err'; $('loadText').textContent = 'Could not start the simulation: ' + err.message;
  }
})();
</script>
</body>
</html>
