<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>HELIOS · Solar Orrery</title>
<style>
  :root{
    --panel: rgba(13,17,28,.56);
    --panel-2: rgba(13,17,28,.72);
    --stroke: rgba(255,255,255,.12);
    --stroke-2: rgba(255,255,255,.06);
    --txt:#e9eef7;
    --dim:#94a0bb;
    --faint:#5f6a85;
    --acc:#6ee7ff;
    --acc-2:#8aa6ff;
    --good:#5fe3a1;
    --r:14px;
    --shadow:0 12px 40px rgba(0,0,0,.45);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#04060d;color:var(--txt);font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
  canvas#scene{position:fixed;inset:0;display:block;z-index:0;touch-action:none;outline:none}

  /* ---------- HUD ---------- */
  .hud{position:fixed;inset:0;z-index:10;pointer-events:none}
  .panel{
    background:var(--panel);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    backdrop-filter:blur(16px) saturate(140%);
    border:1px solid var(--stroke);
    border-radius:var(--r);
    box-shadow:var(--shadow);
  }
  .pe{pointer-events:auto}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* Brand (top-left) */
  #brand{position:fixed;top:18px;left:18px;padding:12px 15px 13px;max-width:min(78vw,420px)}
  #brand .row{display:flex;align-items:center;gap:11px}
  #brand .mark{width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:conic-gradient(from 200deg,#6ee7ff,#8aa6ff 35%,#3a2d6b 70%,#6ee7ff);
    box-shadow:0 0 18px rgba(110,231,255,.45);position:relative}
  #brand .mark::after{content:"";position:absolute;inset:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe6a8,#ff8a3c 55%,#3a1200);
    box-shadow:0 0 10px rgba(255,150,60,.7)}
  #brand .name{font-size:16px;font-weight:700;letter-spacing:.14em;
    background:linear-gradient(90deg,#eaffff,#9fd6ff 60%,#b9a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #brand .sub{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
  #brand .sub b{color:var(--acc);font-weight:600}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--good);
    font-family:var(--mono);letter-spacing:.08em;margin-left:auto}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  /* Clock (top-left, under brand) */
  #clock{position:fixed;top:calc(18px + 66px);left:18px;padding:11px 15px;min-width:196px}
  #clock .lbl{font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
  #clock .date{font-size:20px;font-weight:600;margin-top:3px}
  #clock .elapsed{font-size:11px;color:var(--dim);margin-top:2px}
  #clock .elapsed b{color:var(--acc-2);font-weight:600}

  /* Toggles (top-right) */
  #toggles{position:fixed;top:18px;right:18px;padding:9px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(70vw,320px)}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;
    border:1px solid var(--stroke);background:rgba(255,255,255,.03);color:var(--dim);
    font-size:12px;font-weight:600;cursor:pointer;transition:.16s;user-select:none;white-space:nowrap}
  .chip .cdot{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.16s}
  .chip:hover{color:var(--txt);border-color:var(--stroke-2);transform:translateY(-1px)}
  .chip.on{color:var(--txt);border-color:rgba(110,231,255,.5);background:rgba(110,231,255,.10)}
  .chip.on .cdot{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .chip.ghost{color:var(--dim)}

  /* System list (right) */
  #system{position:fixed;top:calc(18px + 58px);right:18px;width:210px;padding:10px 0 8px}
  #system .head{display:flex;align-items:center;gap:8px;padding:2px 14px 9px;cursor:pointer;user-select:none}
  #system .head .t{font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;font-weight:700}
  #system .head .chev{margin-left:auto;width:14px;height:14px;border-radius:4px;border:1px solid var(--stroke);
    display:grid;place-items:center;transition:.2s;color:var(--dim)}
  #system .head .chev::after{content:"";width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid var(--dim)}
  #system.collapsed .head .chev::after{border-top:none;border-bottom:4px solid var(--dim)}
  #system .list{max-height:min(52vh,520px);overflow-y:auto;overflow-x:hidden;transition:max-height .25s ease}
  #system.collapsed .list{max-height:0}
  #system .list::-webkit-scrollbar{width:7px}
  #system .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;transition:.14s;position:relative}
  .item:hover{background:rgba(255,255,255,.05)}
  .item .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
  .item .nm{font-size:13px;font-weight:500}
  .item .pc{margin-left:auto;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
  .item.active{background:linear-gradient(90deg,rgba(110,231,255,.14),rgba(110,231,255,.02))}
  .item.active .nm{color:#fff;font-weight:600}
  .item.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 8px var(--acc)}

  /* Info card (bottom-left) */
  #info{position:fixed;left:18px;bottom:18px;width:288px;padding:15px 16px;
    opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none}
  #info.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #info .top{display:flex;align-items:center;gap:10px}
  #info .idot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 10px currentColor}
  #info .inm{font-size:18px;font-weight:700;letter-spacing:.01em}
  #info .itype{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:2px}
  #info .close{margin-left:auto;width:24px;height:24px;border-radius:7px;border:1px solid var(--stroke);
    background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;transition:.15s}
  #info .close:hover{color:#fff;border-color:var(--stroke-2);background:rgba(255,255,255,.06)}
  #info .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:14px}
  #info .kv .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  #info .kv .v{font-size:14px;font-weight:600;margin-top:2px;font-family:var(--mono)}
  #info .fact{margin-top:13px;font-size:11.5px;line-height:1.55;color:var(--dim);
    border-top:1px solid var(--stroke-2);padding-top:11px}

  /* Time controls (bottom-center) */
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;padding:11px 13px;max-width:min(94vw,720px)}
  #bar .grp{display:flex;align-items:center;gap:8px}
  .btn{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;cursor:pointer;
    border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--txt);transition:.15s}
  .btn:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
  .btn svg{width:16px;height:16px;fill:currentColor}
  #play{background:linear-gradient(135deg,rgba(110,231,255,.22),rgba(138,166,255,.16));
    border-color:rgba(110,231,255,.5);color:#dff6ff;width:46px;height:46px}
  #play:hover{background:linear-gradient(135deg,rgba(110,231,255,.34),rgba(138,166,255,.26))}
  .sep{width:1px;height:30px;background:var(--stroke-2)}
  #speed{width:min(40vw,220px)}
  #speed .slbl{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);
    letter-spacing:.08em;margin-bottom:5px;text-transform:uppercase}
  #speed .slbl b{color:var(--acc);font-family:var(--mono);letter-spacing:0}
  input[type=range].slider{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;
    background:linear-gradient(90deg,rgba(110,231,255,.55) 0%,rgba(138,166,255,.55) var(--fill,40%),rgba(255,255,255,.12) var(--fill,40%));
    outline:none;cursor:pointer}
  input[type=range].slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#eafcff;border:2px solid var(--acc);box-shadow:0 0 10px rgba(110,231,255,.6);cursor:pointer;transition:.12s}
  input[type=range].slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type=range].slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#eafcff;
    border:2px solid var(--acc);box-shadow:0 0 10px rgba(110,231,255,.6);cursor:pointer}
  .presets{display:flex;gap:5px}
  .presets .p{padding:6px 9px;border-radius:8px;font-size:11px;font-weight:600;color:var(--dim);
    border:1px solid var(--stroke);background:rgba(255,255,255,.03);cursor:pointer;transition:.14s;font-family:var(--mono)}
  .presets .p:hover{color:var(--txt)}
  .presets .p.on{color:#06121a;background:var(--acc);border-color:var(--acc)}
  #hint{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);font-size:11px;color:var(--faint);
    letter-spacing:.03em;transition:opacity .4s;text-align:center}
  #hint b{color:var(--dim);font-weight:600}
  #hint.hide{opacity:0}

  /* Labels */
  .lbl{position:absolute;transform:translate(-50%,-140%);font-size:11px;font-weight:600;letter-spacing:.03em;
    color:rgba(233,238,247,.9);text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6);
    white-space:nowrap;pointer-events:none;transition:opacity .15s}
  .lbl::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;
    margin-right:5px;vertical-align:middle;box-shadow:0 0 6px currentColor}

  /* Loader */
  #loader{position:fixed;inset:0;z-index:20;background:#04060d;display:grid;place-items:center;transition:opacity .6s}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--acc);animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loader .lt{position:absolute;margin-top:78px;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}

  @media (max-width:680px){
    #system{width:170px;top:calc(18px + 50px)}
    #clock{min-width:150px}
    #info{width:min(94vw,300px)}
    #bar{flex-wrap:wrap;justify-content:center;gap:10px}
    #hint{display:none}
    #brand .sub{display:none}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="panel" id="brand">
      <div class="row">
        <div class="mark"></div>
        <div>
          <div class="name">HELIOS</div>
          <div class="sub">Solar Orrery · <b>Keplerian</b> motion · Three.js</div>
        </div>
        <div class="live"><span class="dot"></span>LIVE</div>
      </div>
    </div>

    <div class="panel" id="clock">
      <div class="lbl">Simulated Date</div>
      <div class="date mono" id="date">2026-09-11</div>
      <div class="elapsed">T+ <b id="elapsed">0.0 yr</b></div>
    </div>

    <div class="panel pe" id="toggles">
      <button class="chip on" data-tog="orbits"><span class="cdot"></span>Orbits</button>
      <button class="chip on" data-tog="labels"><span class="cdot"></span>Labels</button>
      <button class="chip on" data-tog="glow"><span class="cdot"></span>Glow</button>
      <button class="chip ghost" id="resetView">⟲ View</button>
    </div>

    <div class="panel pe" id="system">
      <div class="head" id="sysHead">
        <span class="t">System</span>
        <span class="chev"></span>
      </div>
      <div class="list" id="sysList"></div>
    </div>

    <div class="panel pe" id="info">
      <div class="top">
        <span class="idot" id="iDot"></span>
        <div>
          <div class="inm" id="iName">Earth</div>
          <div class="itype" id="iType">Planet</div>
        </div>
        <button class="close" id="iClose">✕</button>
      </div>
      <div class="grid" id="iGrid"></div>
      <div class="fact" id="iFact"></div>
    </div>

    <div id="hint">Drag to orbit · Scroll to zoom · <b>Click a body</b> to focus · <b>Space</b> play/pause · <b>←→</b> speed</div>

    <div class="panel pe" id="bar">
      <div class="grp">
        <button class="btn" id="reverse" title="Reverse time (R)">
          <svg viewBox="0 0 24 24"><path d="M11 6L5 12l6 6v-4c4-1 8-2 10-6-2-4-6-5-10-6v4z"/></svg>
        </button>
        <button class="btn" id="play" title="Play / Pause (Space)">
          <svg id="playIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn" id="nextFwd" title="Forward (skip reverse)">
          <svg viewBox="0 0 24 24"><path d="M13 6l6 6-6 6v-4c-4-1-8-2-10-6 2-4 6-5 10-6v4z"/></svg>
        </button>
      </div>
      <div class="sep"></div>
      <div id="speed">
        <div class="slbl"><span>Time Warp</span><span><b id="spdTxt">7.0 d/s</b></span></div>
        <input type="range" class="slider" id="slider" min="0" max="1000" value="415" />
      </div>
      <div class="sep"></div>
      <div class="presets" id="presets">
        <button class="p" data-dps="1">1d</button>
        <button class="p on" data-dps="7">7d</button>
        <button class="p" data-dps="30">30d</button>
        <button class="p" data-dps="365">1yr</button>
        <button class="p" data-dps="3650">10yr</button>
      </div>
      <div class="sep"></div>
      <button class="btn" id="resetClock" title="Reset clock to today (C)" style="width:38px;height:38px">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </div>

    <div id="labels"></div>
  </div>

  <div id="loader"><div class="spin"></div><div class="lt">Rendering orbits…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   HELIOS — Solar System Orrery
   Correct relative orbital periods + Kepler's 2nd law
   (planets speed up at perihelion), axial tilt, spin, Moon.
   Distances/radii are compressed for visibility (not to scale).
   ============================================================ */

const clamp = v => v<0?0:v>255?255:v|0;
const hexToRgb = h => { h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };

/* ---------- Real data (km, AU, days, degrees) ---------- */
const BODIES = [
  {key:'sun',    name:'Sun',     type:'Star',   color:'#ffcf6b', aAU:0,      e:0,      periodDays:0,     rotDays:25.38,  tilt:7.25,  radiusKm:696340,
    fact:"Contains 99.86% of the solar system's mass. Fuses ~600 million tonnes of hydrogen every second."},
  {key:'mercury',name:'Mercury', type:'Planet', color:'#b0a08a', aAU:0.387,  e:0.2056, periodDays:87.97,  rotDays:58.646, tilt:0.03,  radiusKm:2439.7,
    fact:"Smallest planet. Its 3:2 spin-orbit resonance makes one full day/night cycle (176 d) twice as long as its year (88 d)."},
  {key:'venus',  name:'Venus',   type:'Planet', color:'#e7cfa0', aAU:0.723,  e:0.0068, periodDays:224.70, rotDays:-243.02,tilt:177.4, radiusKm:6051.8,
    fact:"Rotates backwards — the Sun rises in the west. Its day (243 d) is longer than its year (225 d). Hottest surface in the system."},
  {key:'earth',  name:'Earth',   type:'Planet', color:'#4a90d9', aAU:1.0,    e:0.0167, periodDays:365.25, rotDays:0.9973, tilt:23.44, radiusKm:6371,
    fact:"The only known world with liquid-water oceans and life. Home."},
  {key:'mars',   name:'Mars',    type:'Planet', color:'#c1552f', aAU:1.524,  e:0.0934, periodDays:686.98, rotDays:1.026,  tilt:25.19, radiusKm:3389.5,
    fact:"Home to Olympus Mons — the largest volcano in the solar system (~22 km) — and Valles Marineris, a canyon 4,000 km long."},
  {key:'jupiter',name:'Jupiter', type:'Planet', color:'#d3b184', aAU:5.203,  e:0.0489, periodDays:4332.6, rotDays:0.4135, tilt:3.13,  radiusKm:69911,
    fact:"The Great Red Spot is a storm wider than Earth that has raged for at least 300 years. More massive than all other planets combined."},
  {key:'saturn', name:'Saturn',  type:'Planet', color:'#e6d4a3', aAU:9.537,  e:0.0565, periodDays:10759,  rotDays:0.444,  tilt:26.73, radiusKm:58232,
    fact:"Its rings span 282,000 km yet are often only ~10 m thick. Least dense planet — it would float in a big enough pool."},
  {key:'uranus', name:'Uranus',  type:'Planet', color:'#a6e3e1', aAU:19.19,  e:0.0457, periodDays:30688,  rotDays:-0.718, tilt:97.77, radiusKm:25362,
    fact:"Tipped ~98°, it rolls around the Sun on its side. Has the coldest planetary atmosphere (~-224 °C)."},
  {key:'neptune',name:'Neptune', type:'Planet', color:'#4a68d6', aAU:30.07,  e:0.0113, periodDays:60182,  rotDays:0.671,  tilt:28.32, radiusKm:24622,
    fact:"Fastest winds in the solar system (~2,100 km/h). Discovered by mathematical prediction in 1846 before it was seen."},
  {key:'moon',   name:'Moon',    type:'Moon',   color:'#cfc7bd', aAU:0.00257,e:0.0549, periodDays:27.32,  rotDays:27.32,  tilt:6.68,  radiusKm:1737.4,
    fact:"Tidally locked — the same face always points at Earth. Receding ~3.8 cm every year."},
];

/* ---------- Scaled geometry (compressed for visibility) ---------- */
const AU_K = 30, R_K = 0.6, MOON_R = 2.6;
const scaledA  = b => b.key==='sun' ? 0 : b.key==='moon' ? MOON_R : AU_K*Math.pow(b.aAU,0.72);
const scaledR  = b => b.key==='sun' ? 5.6 : R_K*Math.pow(b.radiusKm/6371,0.5);
const GOLD = Math.PI*(3-Math.sqrt(5));
BODIES.forEach((b,i)=>{ b.sA=scaledA(b); b.sR=scaledR(b); b.phase = i*GOLD; b.rgb=hexToRgb(b.color); });
const byKey = Object.fromEntries(BODIES.map(b=>[b.key,b]));
const EARTH = byKey.earth;

/* ---------- Renderer / Scene / Camera ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 6000);
const OV_POS = new THREE.Vector3(0,150,330);
camera.position.copy(OV_POS);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 8; controls.maxDistance = 1400;
controls.target.set(0,0,0);

/* ---------- Lights ---------- */
scene.add(new THREE.AmbientLight(0x223047, 0.55));
const sunLight = new THREE.PointLight(0xfff2d6, 2.4, 0, 0); // decay 0 -> uniform lighting
scene.add(sunLight);

/* ---------- Procedural textures ---------- */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w;c.height=h;
  const g=c.getContext('2d'); draw(g,w,h); const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }

function gasTexture(palette, seed, turb=0.10){
  const bands=palette.length;
  return canvasTex(512,256,(g,w,h)=>{
    const rnd=rng(seed), img=g.createImageData(w,h), d=img.data;
    for(let y=0;y<h;y++){ const ny=y/h;
      for(let x=0;x<w;x++){
        const wob=Math.sin(x*0.018+ny*14+((rnd()-0.5)*turb))*0.5
                 + Math.sin(x*0.006-ny*8)*0.5*turb;
        let idx=Math.floor((ny+wob)*bands); idx=((idx%bands)+bands)%bands;
        const c=palette[idx], n=(rnd()-0.5)*16;
        const px=(y*w+x)*4;
        d[px]=clamp(c[0]+n); d[px+1]=clamp(c[1]+n); d[px+2]=clamp(c[2]+n); d[px+3]=255;
      }}
    g.putImageData(img,0,0);
  });
}

/* ---------- Saturn rings ---------- */
function saturnRings(r){
  const inner=r*1.35, outer=r*2.3;
  const geo=new THREE.RingGeometry(inner,outer,96,1);
  // radial color gradient via uv
  const pos=geo.attributes.position, uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i),y=pos.getY(i);
    const dist=Math.hypot(x,y); uv.setXY(i,(dist-inner)/(outer-inner),0.5); }
  const c=document.createElement('canvas'); c.width=256;c.height=16; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,256,0);
  const stops=[[0,'rgba(210,190,140,.05)'],[0.12,'rgba(225,205,150,.55)'],[0.3,'rgba(120,105,80,.25)'],
    [0.42,'rgba(235,215,160,.7)'],[0.55,'rgba(90,80,65,.15)'],[0.7,'rgba(230,210,155,.6)'],
    [0.85,'rgba(215,195,140,.5)'],[1,'rgba(200,180,130,0)']];
  stops.forEach(s=>grd.addColorStop(s[0],s[1])); g.fillStyle=grd; g.fillRect(0,0,256,16);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.MeshBasicMaterial({map:t, side:THREE.DoubleSide, transparent:true, depthWrite:false, opacity:0.95});
  const ring=new THREE.Mesh(geo,m); ring.rotation.x=Math.PI/2; return ring;
}

/* ---------- Star field ---------- */
function makeStars(count, size, band){
  const pos=new Float32Array(count*3), col=new Float32Array(count*3);
  const rnd=rng(band?999:1234);
  for(let i=0;i<count;i++){
    const u=rnd(), v=rnd(), th=2*Math.PI*u, ph=Math.acos(2*v-1);
    let r=1100+rnd()*700;
    let x=r*Math.sin(ph)*Math.cos(th), y=r*Math.cos(ph), z=r*Math.sin(ph)*Math.sin(th);
    if(band){ // concentrate near a tilted plane
      const rr=900+rnd()*900, a=rnd()*2*Math.PI;
      x=Math.cos(a)*rr; z=Math.sin(a)*rr; y=(rnd()-0.5)*(rnd()-0.5)*420;
    }
    const pick=rnd();
    let c = pick<0.62?[223,230,255] : pick<0.8?[170,198,255] : pick<0.92?[255,217,166] : [255,246,255];
    const b=0.35+rnd()*0.65;
    col[i*3]=c[0]/255*b; col[i*3+1]=c[1]/255*b; col[i*3+2]=c[2]/255*b;
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size, sizeAttenuation:false, vertexColors:true,
    transparent:true, opacity:band?0.55:0.9, depthWrite:false});
  const p=new THREE.Points(geo,mat);
  if(band) p.rotation.x=-0.42;
  return p;
}

/* ---------- Orbit lines ---------- */
function orbitLine(a,e,color,seg=256,op=0.34){
  const b=a*Math.sqrt(1-e*e), pts=[];
  for(let i=0;i<seg;i++){ const E=2*Math.PI*i/seg;
    pts.push(new THREE.Vector3(a*(Math.cos(E)-e),0,b*Math.sin(E))); }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineLoop(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
}

/* ---------- Kepler solver ---------- */
function solveKepler(M,e){
  M=((M%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  let E=e<0.8?M:Math.PI;
  for(let i=0;i<7;i++){ const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); E-=d; if(Math.abs(d)<1e-6)break; }
  return E;
}

/* ---------- Camera follow / tween ---------- */
const easeInOutCubic=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let tween=null, focus=null;
const _v=new THREE.Vector3();
function flyTo(pos,target,track=null,dur=700){
  tween={fromPos:camera.position.clone(), fromTgt:controls.target.clone(),
         toPos:pos.clone(), toTgt:target.clone(), track, start:performance.now(), dur};
  if(track) tween._off=pos.clone().sub(target);
}
function focusBody(b){
  focus=b; updateList();
  const bp=b.anchor.getWorldPosition(new THREE.Vector3());
  const dist=(b.sR*4.2)+ (b.key==='sun'?22:0) + 1.5;
  const dir=new THREE.Vector3(0.6,0.34,1).normalize();
  flyTo(bp.clone().add(dir.multiplyScalar(dist)), bp, b);
  showInfo(b);
}

function updateFollow(){
  if(tween){
    let toPos=tween.toPos, toTgt=tween.toTgt;
    if(tween.track){ const bp=tween.track.anchor.getWorldPosition(new THREE.Vector3());
      toTgt=bp; toPos=bp.clone().add(tween._off); }
    const t=Math.min(1,(performance.now()-tween.start)/tween.dur), e=easeInOutCubic(t);
    camera.position.lerpVectors(tween.fromPos,toPos,e);
    controls.target.lerpVectors(tween.fromTgt,toTgt,e);
    if(t>=1) tween=null;
  }
  if(!tween && focus){
    const bp=focus.anchor.getWorldPosition(new THREE.Vector3());
    const d=bp.clone().sub(controls.target);
    camera.position.add(d); controls.target.copy(bp);
  }
}

const _p=new THREE.Vector3(), _fwd=new THREE.Vector3(), _to=new THREE.Vector3(), _proj=new THREE.Vector3();
function updateLabels(){

  for(const el of labelEls){
    const b=el.b; b.anchor.getWorldPosition(_p);
    camera.getWorldDirection(_fwd);
    _to.copy(_p).sub(camera.position);
    if(_fwd.dot(_to)<0){ el.style.display='none'; continue; }
    _proj.copy(_p).project(camera);
    if(Math.abs(_proj.z)>1){ el.style.display='none'; continue; }
    const x=(_proj.x*0.5+0.5)*innerWidth, y=(-_proj.y*0.5+0.5)*innerHeight;
    el.style.display='block'; el.style.left=x+'px'; el.style.top=y+'px';
  }
}

/* ---------- Sim update ---------- */
function updateSim(dtDays){
  for(const b of bodies){
    if(b.key==='sun'){ sunMesh.rotation.y += dtDays*(2*Math.PI)/25.38; continue; }
    if(b.key==='moon'){
      const ma=(2*Math.PI)*simDays/27.32;
      b.moonGroup.position.set(Math.cos(ma)*MOON_R,0,Math.sin(ma)*MOON_R);
      b.mesh.rotation.y=ma+Math.PI;
      continue;
    }
    const M=b.phase+(2*Math.PI)*simDays/b.periodDays;
    const E=solveKepler(M,b.e);
    const a=b.sA, e=b.e, bb=a*Math.sqrt(1-e*e);
    b.group.position.set(a*(Math.cos(E)-e),0,bb*Math.sin(E));
    let inc=(2*Math.PI)/b.rotDays*dtDays; inc=Math.max(-0.5,Math.min(0.5,inc));
    b.mesh.rotation.y+=inc;
  }
}

  }
});

/* ---------- Click to focus ---------- */
const raycaster=new THREE.Raycaster(); const mouse=new THREE.Vector2();
let downX=0,downY=0;
canvas.addEventListener('pointerdown',e=>{ downX=e.clientX; downY=e.clientY; });
addEventListener('pointerup',e=>{
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return; // was a drag
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(clickTargets,false);
  if(hits[0]&&hits[0].object.userData.key){ focusBody(byKey[hits[0].object.userData.key]); }
});

/* ---------- Clock ---------- */
const dateEl=$('date'), elapsedEl=$('elapsed');
function updateClock(){
  const dt=new Date(EPOCH+simDays*86400000);
  const y=dt.getUTCFullYear(), m=String(dt.getUTCMonth()+1).padStart(2,'0'), dd=String(dt.getUTCDate()).padStart(2,'0');
  dateEl.textContent=`${y}-${m}-${dd}`;
  const yr=Math.abs(simDays)/365.25;
  elapsedEl.textContent=(simDays<0?'− ':'+ ')+(yr>=1? yr.toFixed(2)+' yr' : Math.round(Math.abs(simDays))+' d');
}

/* ---------- Resize ---------- */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* hide hint after a while */
setTimeout(()=>$('hint').classList.add('hide'), 9000);

/* ---------- Main loop ---------- */
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const dtDays=playing? dt*daysPerSec*direction : 0;
  simDays+=dtDays;
  updateSim(dtDays);
  updateFollow();
  updateLabels();
  updateClock();
  controls.update();
  renderer.render(scene,camera);
}
animate();

// loader fade
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  $('loader').classList.add('gone');
  setTimeout(()=>$('loader').remove(),700);
}));
</script>
</body>
</html>
